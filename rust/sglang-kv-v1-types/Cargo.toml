[package]
name = "sglang-kv-v1-types"
description = "Generated bindings for the sglang.kv.v1 KV cache event service: prost structs, tonic services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# No [package.metadata.sglang]: not a Python extension; wheel builds skip it.

[lib]
name = "sglang_kv_v1_types"
crate-type = ["rlib"]

[dependencies]
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
